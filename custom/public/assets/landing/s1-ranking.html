<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S1 决赛项目展示 | 滴水湖全球 OPC 人工智能挑战赛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: OPPOSans;
      src: url("https://cdn.jsdelivr.net/gh/project-noonnu/noonfonts_seven@1.0/OPPOSans-Medium.woff") format("woff");
      font-style: normal;
      font-weight: 500;
    }

    :root {
      --bg: #222222;
      --ink: #ffffff;
      --muted: #ababab;
      --surface: #131313;
      --surface-container: #1c1c1c;
      --surface-high: #282828;
      --paper: #1A1C1D;
      --paper-warm: #1A1C1D;
      --card-shell: #3B3B3B;
      --card-panel: #3B3B3B;
      --card-panel-deep: #3B3B3B;
      --card-border: rgba(255, 255, 255, .12);
      --card-shadow: 0 18px 28px rgba(0, 0, 0, .18);
      --black: #0b0d10;
      --green: #bbfd3b;
      --pink: #ff74a7;
      --orange: #fb7a38;
      --cyan: #41faf4;
      --yellow: #FFA526;
      --accent-green: #bbfd3b;
      --accent-orange: #fb7a38;
      --accent-pink: #ff74a7;
      --accent-cyan: #41faf4;
      --accent-yellow: #FFA526;
      --primary-accent: #bbfd3b;
      --on-primary-accent: #050505;
      --detail-button-bg: #ffffff;
      --detail-button-fg: #111827;
      --secondary-button-bg: #F4F6FA;
      --secondary-button-fg: #111827;
      --disabled-button-bg: #767B84;
      --disabled-button-fg: #FFFFFF;
      --line: rgba(255, 255, 255, .16);
      --stroke: 1px solid rgba(255, 255, 255, .14);
      --stroke-dark: 1px solid rgba(17, 24, 39, .10);
      --soft-shadow: none;
      --container: min(1440px, calc(100% - clamp(28px, 4.8vw, 72px)));
      --motion: cubic-bezier(.2, 0, 0, 1);
    }

    body.theme-light {
      --bg: #EEEEEE;
      --ink: #111827;
      --muted: #4B5563;
      --surface: #FFFFFF;
      --surface-container: #F3F4F6;
      --surface-high: #E9EBEF;
      --paper: #FFFFFF;
      --paper-warm: #FFFFFF;
      --card-shell: #FFFFFF;
      --card-panel: #FFFFFF;
      --card-panel-deep: #F3F4F6;
      --card-border: rgba(17, 24, 39, .12);
      --card-shadow: 0 14px 24px rgba(17, 24, 39, .08);
      --line: rgba(17, 24, 39, .12);
      --stroke: 1px solid rgba(17, 24, 39, .10);
      --primary-accent: #FAAD14;
      --on-primary-accent: #111827;
      --accent-green: #A5E448;
      --accent-orange: #EE7A2C;
      --accent-pink: #ED76A8;
      --accent-cyan: #46D4D7;
      --accent-yellow: #FAAD14;
      --detail-button-bg: #111827;
      --detail-button-fg: #ffffff;
      --secondary-button-bg: #111827;
      --secondary-button-fg: #ffffff;
      --disabled-button-bg: #DDE1E7;
      --disabled-button-fg: #6B7280;
    }

    * { box-sizing: border-box; }

    html { min-width: 328px; scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 328px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: Poppins, OPPOSans, Manrope, sans-serif;
      overflow-x: hidden;
    }

    body.modal-open { overflow: hidden; }

    a, button { font: inherit; }
    a { color: inherit; text-decoration: none; }
    button { border: 0; cursor: pointer; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid rgba(255,255,255,.09);
      background: rgba(34,34,34,.86);
      backdrop-filter: blur(18px);
    }

    .header-inner {
      --header-mark-size: clamp(32px, 2.8vw, 42px);
      width: var(--container);
      min-height: clamp(62px, 5vw, 78px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(10px, 1.2vw, 16px);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: calc(var(--header-mark-size) * .78);
      height: var(--header-mark-size);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: calc(var(--header-mark-size) * 1.5);
      font-weight: 400;
      line-height: .78;
      padding: 0 0 2px;
      transition: transform .22s var(--motion), color .22s var(--motion);
    }

    .back-link:hover {
      transform: translateX(-3px);
      color: var(--primary-accent);
    }

    .header-title {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--ink);
      font-weight: 900;
      letter-spacing: -.03em;
    }

    .header-title img {
      width: var(--header-mark-size);
      height: auto;
      border-radius: 8px;
      flex: 0 0 auto;
    }

    .header-title span {
      font-size: clamp(15px, 1.4vw, 20px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    body.theme-light .site-header {
      border-bottom-color: rgba(17,24,39,.10);
      background: rgba(238,238,238,.88);
    }

    main {
      width: var(--container);
      margin: 0 auto;
      padding: clamp(24px, 3.6vw, 48px) 0 clamp(58px, 7vw, 96px);
    }

    .ranking-hero {
      position: relative;
      display: block;
      padding: 0;
      border: 0;
      border-radius: 14px;
      background: var(--paper-warm);
      color: var(--ink);
      box-shadow: var(--soft-shadow);
      overflow: hidden;
      isolation: isolate;
      animation: page-rise .68s var(--motion) both;
    }

    .ranking-hero::before {
      content: none;
    }

    .ranking-hero::after {
      content: none;
    }

    .hero-banner {
      position: relative;
      min-height: clamp(360px, 42vw, 560px);
      display: flex;
      align-items: end;
      overflow: hidden;
      background: var(--surface);
      isolation: isolate;
    }

    .hero-banner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(1.1);
      transform: scale(1.02);
      z-index: 0;
    }

    .hero-banner::before {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 58%;
      background-image:
        linear-gradient(to top, rgba(0, 0, 0, 0.80) 0%, rgba(0, 0, 0, 0.44) 48%, rgba(0, 0, 0, 0.18) 72%, rgba(0, 0, 0, 0) 100%),
        linear-gradient(to left, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.04) 52%, rgba(0, 0, 0, 0.11) 100%);
      filter: blur(20px);
      transform: translateY(8px) scale(1.04);
      transform-origin: center bottom;
      pointer-events: none;
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: min(860px, 100%);
      padding: clamp(24px, 4vw, 56px);
      color: #fff;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: 100%;
      padding: 7px 12px;
      margin-bottom: clamp(12px, 2vw, 18px);
      border: 0;
      border-radius: 2px;
      background: var(--accent-yellow);
      color: var(--on-primary-accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .hero-kicker::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--on-primary-accent);
    }

    .ranking-hero h1 {
      margin: 0;
      max-width: 100%;
      font-size: min(clamp(38px, 4.8vw, 68px), calc((100vw - 86px) / 9.4));
      line-height: .92;
      letter-spacing: -.055em;
      font-weight: 800;
      white-space: nowrap;
    }

    .ranking-hero p {
      max-width: 780px;
      margin: clamp(14px, 1.8vw, 22px) 0 0;
      color: rgba(255,255,255,.82);
      font-size: clamp(14px, 1.18vw, 17px);
      line-height: 1.55;
      font-weight: 700;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: clamp(36px, 5vw, 64px) 0 clamp(14px, 2vw, 22px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--accent-orange);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-orange);
      flex: 0 0 auto;
    }

    .section-head h2 {
      margin: 7px 0 0;
      font-size: clamp(28px, 3.6vw, 48px);
      line-height: .95;
      letter-spacing: -.06em;
      font-weight: 900;
    }

    .section-head h2::after {
      content: "";
      display: block;
      width: clamp(54px, 6vw, 92px);
      height: 5px;
      margin-top: 10px;
      border-radius: 999px;
      background: var(--accent-orange);
    }

    .section-head p {
      max-width: 760px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(13px, 1.15vw, 16px);
      line-height: 1.55;
      font-weight: 800;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(18px, 2vw, 30px);
      align-items: stretch;
    }

    .team-card {
      --accent: var(--primary-accent);
      --on-accent: var(--on-primary-accent);
      --card-surface: var(--card-shell);
      --hover-border: var(--accent);
      --text: var(--ink);
      --panel: #2d3036;
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--card-surface);
      color: var(--text);
      height: auto;
      min-height: 0;
      box-shadow: var(--card-shadow);
      transition: opacity .62s var(--motion), transform .62s var(--motion), border-color .22s var(--motion), box-shadow .22s var(--motion);
      transition-delay: var(--reveal-delay, 0ms);
    }

    .team-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 0 solid var(--hover-border);
      border-radius: inherit;
      pointer-events: none;
      transition: border-color .22s var(--motion), border-width .22s var(--motion);
      z-index: 4;
    }

    .team-card:nth-child(15n+1),
    .team-card:nth-child(15n+2),
    .team-card:nth-child(15n+3) { --accent: var(--accent-green); }
    .team-card:nth-child(15n+4),
    .team-card:nth-child(15n+5),
    .team-card:nth-child(15n+6) { --accent: var(--accent-orange); }
    .team-card:nth-child(15n+7),
    .team-card:nth-child(15n+8),
    .team-card:nth-child(15n+9) { --accent: var(--accent-cyan); }
    .team-card:nth-child(15n+10),
    .team-card:nth-child(15n+11),
    .team-card:nth-child(15n+12) { --accent: var(--accent-pink); }
    .team-card:nth-child(15n+13),
    .team-card:nth-child(15n+14),
    .team-card:nth-child(15n+15) { --accent: var(--accent-yellow); }

    .is-reveal-pending {
      opacity: 0;
      transform: translateY(18px) scale(.988);
    }

    .is-reveal-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .team-card:hover {
      transform: translateY(-3px) scale(1.004);
      border-color: var(--hover-border);
      box-shadow: 0 20px 32px rgba(0, 0, 0, .22);
    }

    .team-card:hover::after {
      border-color: var(--hover-border);
      border-width: 2px;
    }

    .team-card.is-reveal-visible:hover {
      transform: translateY(-4px) scale(1.006);
    }

    .poster {
      position: relative;
      aspect-ratio: 3 / 2;
      flex: 0 0 auto;
      width: 100%;
      height: auto;
      min-height: 0;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background: var(--surface-high);
      color: #fff;
      isolation: isolate;
    }

    .poster::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: var(--accent);
      opacity: .96;
      z-index: 1;
      transition: height .28s var(--motion), opacity .28s var(--motion);
    }

    .poster::after {
      content: none;
    }

    .poster-img {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .poster.is-missing {
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, .05) 0 2px, transparent 2px 18px),
        var(--surface-high);
    }

    .team-card:hover .poster::before {
      height: 6px;
      opacity: 1;
    }

    .rank-chip {
      position: absolute;
      left: clamp(7px, .8vw, 10px);
      top: clamp(7px, .8vw, 10px);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: clamp(24px, 2.1vw, 30px);
      padding: 0 clamp(8px, .75vw, 10px);
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: clamp(9px, .75vw, 11px);
      font-weight: 700;
      letter-spacing: .08em;
    }

    .poster-stage {
      position: absolute;
      right: clamp(7px, .8vw, 10px);
      top: clamp(7px, .8vw, 10px);
      z-index: 2;
      min-height: clamp(24px, 2.1vw, 30px);
      display: inline-flex;
      align-items: center;
      padding: 0 clamp(8px, .75vw, 10px);
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      font-size: clamp(8px, .7vw, 10px);
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .rank-chip::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--on-accent);
    }

    .card-body {
      display: grid;
      grid-template-rows: auto auto auto auto;
      flex: 1;
      gap: clamp(6px, .7vw, 8px);
      padding: clamp(10px, 1vw, 14px);
      min-height: 0;
      background: linear-gradient(180deg, var(--card-panel) 0%, var(--card-panel-deep) 100%);
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: clamp(17px, 1.45vw, 22px);
      color: var(--muted);
      opacity: 1;
      font-size: clamp(8px, .72vw, 10px);
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .meta-row span {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .meta-row b {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: clamp(8px, .68vw, 10px);
      letter-spacing: .08em;
    }

    .team-card h3 {
      margin: 0;
      min-height: 2.16em;
      font-size: clamp(14px, 1.15vw, 18px);
      line-height: 1.12;
      letter-spacing: -.015em;
      font-weight: 700;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .source-grid {
      display: none;
      gap: 3px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      font-size: clamp(10px, .82vw, 12px);
      line-height: 1.38;
      font-weight: 650;
      min-height: 0;
      max-height: none;
      overflow: hidden;
      color: #4a4f58;
    }

    .source-grid span {
      display: grid;
      gap: 2px;
      min-width: 0;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .source-grid b {
      color: #6a717d;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: none;
    }

    .intro-text {
      margin: 0;
      color: currentColor;
      opacity: .72;
      font-size: clamp(10px, .78vw, 12px);
      line-height: 1.42;
      font-weight: 500;
      white-space: normal;
      overflow-wrap: anywhere;
      min-height: 2.84em;
      max-height: none;
      overflow: hidden;
      padding-right: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(5px, .6vw, 7px);
      margin-top: auto;
      padding-top: 2px;
    }

    .card-link {
      min-width: 0;
      min-height: clamp(30px, 2.25vw, 34px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      padding: 0 10px;
      font-size: clamp(9.2px, .74vw, 11px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
      transition: transform .2s var(--motion);
    }

    .card-link.primary {
      background: var(--accent);
      color: var(--on-accent);
    }
    .card-link:hover { transform: translateY(-2px); }
    .card-link.primary:hover {
      background: var(--accent);
      color: var(--on-accent);
    }
    .card-link.is-disabled {
      opacity: 1;
      pointer-events: none;
      background: var(--disabled-button-bg);
      color: var(--disabled-button-fg);
    }
    .detail-btn {
      grid-column: 1 / -1;
      background: var(--detail-button-bg);
      color: var(--detail-button-fg);
      border: 0;
      width: 100%;
    }

    .detail-btn:hover {
      background: var(--detail-button-bg);
      color: var(--detail-button-fg);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 36px);
      background: rgba(0,0,0,.68);
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s var(--motion);
    }

    .modal-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .detail-modal {
      width: min(820px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border: var(--stroke-dark);
      border-radius: 22px;
      background: #f7f8fb;
      color: #101114;
      box-shadow: none;
      overflow: hidden;
      transform: translateY(14px) scale(.985);
      transition: transform .24s var(--motion);
    }

    .modal-backdrop.is-open .detail-modal { transform: translateY(0) scale(1); }

    .modal-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
      padding: clamp(16px, 2.4vw, 24px);
      border-bottom: 1px solid rgba(255,255,255,.14);
      background: #2d3036;
      color: #fff;
    }

    .modal-kicker {
      display: inline-flex;
      width: fit-content;
      margin-bottom: 8px;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--accent-yellow);
      color: #050505;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .modal-title {
      margin: 0;
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1.05;
      letter-spacing: -.035em;
      font-weight: 800;
    }

    .modal-close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #050505;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
    }

    .modal-body {
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 12px;
      padding: clamp(16px, 2.4vw, 24px);
    }

    .detail-row {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      gap: 14px;
      padding: 0 0 12px;
      border-bottom: 1px solid rgba(5,5,5,.16);
      font-size: 14px;
      line-height: 1.55;
      font-weight: 650;
    }

    .detail-row b {
      color: #626875;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .06em;
    }

    .detail-row span {
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      padding: 14px clamp(16px, 2.4vw, 24px);

    const THEME_KEY = 'league_theme_mode';
    const systemThemeQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    function readThemeMode() {
      try {
        const mode = localStorage.getItem(THEME_KEY);
        return ['dark', 'light', 'system'].includes(mode) ? mode : 'dark';
      } catch (error) {
        return 'dark';
      }
    }

    function resolveThemeMode(mode) {
      if (mode === 'system') {
        return systemThemeQuery && systemThemeQuery.matches ? 'dark' : 'light';
      }
      return mode === 'light' ? 'light' : 'dark';
    }

    function applyThemeFromMain() {
      const resolved = resolveThemeMode(readThemeMode());
      document.body.classList.toggle('theme-light', resolved === 'light');
      document.body.classList.toggle('theme-dark', resolved !== 'light');
    }

    applyThemeFromMain();

    window.addEventListener('storage', (event) => {
      if (event.key === THEME_KEY) applyThemeFromMain();
    });

    if (systemThemeQuery && systemThemeQuery.addEventListener) {
      systemThemeQuery.addEventListener('change', () => {
        if (readThemeMode() === 'system') applyThemeFromMain();
      });

    const modalBody = document.getElementById('modal-body');
    const modalActions = document.getElementById('modal-actions');

    const escapeHtml = (value) => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

    const sourceText = (value, fallback = '表格未填写') => escapeHtml(value || fallback);

    const accentTokenForRank = (rank) => {
      const group = Math.floor(((rank - 1) % 15) / 3);
      return ['--accent-green', '--accent-orange', '--accent-cyan', '--accent-pink', '--accent-yellow'][group] || '--primary-accent';
    };

    function actionLink(href, label, className = '') {
      if (!href) return '<span class="card-link is-disabled ' + className + '" aria-disabled="true">' + label.replace('访问', '') + '待补</span>';
      return '<a class="card-link ' + className + '" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    }

    function detailRow(label, value, fallback = '表格未填写') {
      return '<div class="detail-row"><b>' + escapeHtml(label) + '</b><span>' + sourceText(value, fallback) + '</span></div>';
    }

    function openDetail(rank) {
      const item = teams.find((entry) => entry.rank === rank);
      if (!item) return;

      modalRank.textContent = '#' + String(item.rank).padStart(2, '0') + ' / S1 W4';
      modalTitle.textContent = item.name || item.systemName || item.displayName || '表格未填写';
      modalBody.innerHTML =
        detailRow('团队/作者', item.team) +
        detailRow('系统项目名', item.systemName || item.name || item.displayName) +
        detailRow('对外展示项目名', item.displayName) +
        detailRow('平台仓库链接', item.repo) +
        detailRow('ECS演示链接', item.demoLinks && item.demoLinks.length ? item.demoLinks.join('\n') : item.demo) +
        detailRow('项目简介', item.intro, '表格未填写项目简介');
      modalActions.style.setProperty('--accent', 'var(' + accentTokenForRank(item.rank) + ')');
      modalActions.style.setProperty('--on-accent', 'var(--on-primary-accent)');
      modalActions.innerHTML =
        actionLink(item.repo, '访问仓库', '') +
        actionLink(item.demo, '访问演示', 'primary');

      detailModal.hidden = false;
      requestAnimationFrame(() => {
        detailModal.classList.add('is-open');
        detailModal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');
      });
    }

    function closeDetail() {
      detailModal.classList.remove('is-open');
      detailModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      window.setTimeout(() => {
        if (!detailModal.classList.contains('is-open')) detailModal.hidden = true;
      }, 240);
    }

        '</div>' +
        '<div class="card-body">' +
          '<div class="meta-row"><span>' + sourceText(item.team) + '</span><b>S1 W4</b></div>' +
          '<h3>' + sourceText(item.name) + '</h3>' +
          '<p class="intro-text">' + sourceText(item.intro, '表格未填写项目简介') + '</p>' +
          '<div class="card-actions">' +
            actionLink(item.repo, '访问仓库', '') +
            actionLink(item.demo, '访问演示', 'primary') +
            '<button class="card-link detail-btn" type="button" data-detail-rank="' + item.rank + '">查看详情</button>' +
          '</div>' +
        '</div>' +
      '</article>';
    }

    function render() {
      teamGrid.innerHTML = teams.map((item, index) => cardTemplate(item, index)).join('');
    }

    function initMotion() {
      const targets = Array.from(document.querySelectorAll('.section-head, .team-card'));
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion || !('IntersectionObserver' in window)) {
        targets.forEach((target) => target.classList.add('is-reveal-visible'));
        return;
      }

      targets.forEach((target, index) => {
        target.classList.add('is-reveal-pending');
        target.style.setProperty('--reveal-delay', `${Math.min(index, 18) * 26}ms`);
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.remove('is-reveal-pending');
          entry.target.classList.add('is-reveal-visible');
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.14, rootMargin: '0px 0px -6% 0px' });

      targets.forEach((target) => observer.observe(target));
    }

    render();
    initMotion();

    teamGrid.addEventListener('click', (event) => {
      const detailButton = event.target.closest('[data-detail-rank]');
      if (!detailButton) return;
      openDetail(Number(detailButton.dataset.detailRank));
    });

    detailModal.addEventListener('click', (event) => {
      if (event.target === detailModal || event.target.closest('[data-close-modal]')) closeDetail();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && detailModal.classList.contains('is-open')) closeDetail();
    });
  </script>
</body>
</html>
