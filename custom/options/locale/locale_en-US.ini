; HackForger custom locale override — en-US
;
; This file is loaded BEFORE the bundled options/locale/locale_en-US.ini via
; Forgejo's `assetfs.Layered(CustomAssets(), BuiltinAssets())` mechanism
; (see modules/options/base.go:15). Keys here override the bundled values;
; absent keys fall through to bundled.
;
; Use this file (NOT the bundled one) for any HackForger-side string changes
; — keeps the upstream Forgejo file unmodified, no merge conflicts on upgrade,
; and respects open-source convention of separating downstream customizations.
;
; Issue #96: there are two product/system names that mean different things and
; should both stay distinct in user-facing text:
;   - HackForger = the underlying SOFTWARE (this Forgejo fork) — credited where
;     the software identity matters: footer "Powered by", system help, theme
;     names, webhook event categories, etc. ALL stay as HackForger.
;   - SynNovator = the activity/event PLATFORM brand — used where the platform
;     experience is described to users.
;
; The only existing locale string that explicitly references the platform brand
; is `hackforger.help.platform.title`, where the bundled value uses the older
; "Synnovator" casing. Override here to fix the canonical trademark casing
; "SynNovator" (camelCase, capital N).

[hackforger]
help.platform.title = Platform Guide (SynNovator)
