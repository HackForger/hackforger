; HackForger custom locale override — en-US
;
; This file is loaded BEFORE the bundled options/locale/locale_en-US.ini via
; Forgejo's `assetfs.Layered(CustomAssets(), BuiltinAssets())` mechanism
; (see modules/options/base.go:15). Keys here override the bundled values;
; absent keys fall through to bundled.
;
; Use this file (NOT the bundled one) for any HackForger-side string changes
; — keeps the upstream Forgejo file unmodified, no merge conflicts on upgrade,
; and respects open-source convention of separating downstream customizations.
;
; Issue #96: rebrand user-visible "HackForger" to "SynNovator" (trademark name).
; Technical identifiers (URL routes, theme IDs like `hackforger-dark`, package
; paths) remain "hackforger" — only display strings change.

[repo]
settings.event_header_hackforger = SynNovator Events

[themes]
; Theme display names. The theme IDs themselves (hackforger-light, -dark) are
; technical identifiers stored in user prefs DB and CSS file paths — they stay.
names.hackforger-light = SynNovator Jadeite Light
names.hackforger-dark = SynNovator Jadeite Dark

[hackforger]
help.system.title = System Guide (SynNovator)
