name: ✨ 功能需求 / Feature Request
description: 想要 HackForger 增加新功能、改进现有功能
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > 提需求前先想想：是 **现有功能不好用**（→ 用 Bug 模板更合适），还是 **完全新功能**（→ 用这个模板）？
        > 如果是想让 HackForger 多支持一种使用场景，欢迎在下面描述清楚。

  - type: textarea
    id: problem
    attributes:
      label: 你现在遇到了什么问题？
      description: |
        先描述场景和痛点，**不要先描述方案**。
        例如："我想把同一份代码同时报名两个 hackathon，现在做不到要分别建 fork。"
      placeholder: 我想 ...，但是现在 ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做？
      description: 你的方案设想。如果不确定怎么实现，可以写多个候选思路。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的临时绕过方案
      description: 如果有的话写一下，能帮我们判断这个需求的优先级。
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 这个需求对你有多紧急？
      options:
        - "马上就要 — 阻塞了我现在的工作"
        - "近期需要 — 大约一两周内"
        - "希望有 — 不急"
        - "只是建议 — 觉得这样会更好"
    validations:
      required: true
